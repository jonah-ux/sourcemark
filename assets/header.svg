<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-labelledby="title desc"><title id="title">Sourcemark overview</title><desc id="desc">Cite a line, a quote, or a database value. After the file is renamed, shifted, or edited, Sourcemark finds it again and says what happened. It also checks that an agent actually read what it cites.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1420"/><stop offset="1" stop-color="#131b2b"/></linearGradient><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#25324a"/></pattern></defs><rect width="1280" height="460" rx="20" fill="url(#bg)"/><rect width="1280" height="460" rx="20" fill="url(#dots)" opacity=".4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect x="46" y="40" width="36" height="36" rx="10" fill="#f5c26b" fill-opacity=".14" stroke="#f5c26b" stroke-opacity=".5"/><path d="M57 51h14M57 58h10M57 65h7" stroke="#f5c26b" stroke-width="2.2" stroke-linecap="round"/><text x="96" y="66" fill="#f2f5fb" font-size="25" font-weight="700">Sourcemark</text><text x="1234" y="62" text-anchor="end" fill="#8494b0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">LOCAL FIRST · ZERO DEPENDENCIES · MIT</text><text x="46" y="134" fill="#f2f5fb" font-size="34" font-weight="700">Citations that survive moves and edits.</text><text x="46" y="170" fill="#a9b6cc" font-size="18">…and proof that an agent actually read what it cites.</text></g><g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15"><rect x="46" y="210" width="360" height="200" rx="14" fill="#182235" stroke="#2b3a55"/><text x="68" y="244" fill="#8494b0" font-size="12">CITE</text><text x="68" y="276" fill="#f2f5fb">docs/lighthouse.md:4-5</text><text x="68" y="306" fill="#f5c26b">[sm:5bwpqidwqh]</text><text x="68" y="342" fill="#a9b6cc" font-size="13">quote + context + position</text><text x="68" y="364" fill="#a9b6cc" font-size="13">fingerprints + git commit</text><text x="68" y="386" fill="#a9b6cc" font-size="13">secrets never stored</text><path d="M418 310h52" stroke="#4b5d80" stroke-width="2"/><path d="M464 304l8 6-8 6" fill="none" stroke="#4b5d80" stroke-width="2"/><rect x="482" y="210" width="360" height="200" rx="14" fill="#182235" stroke="#2b3a55"/><text x="504" y="244" fill="#8494b0" font-size="12">LATER: RENAMED · SHIFTED · EDITED</text><text x="504" y="276" fill="#f2f5fb">sourcemark resolve</text><text x="504" y="310" fill="#7ee0b0">edited</text><text x="580" y="310" fill="#a9b6cc">→ ops/harbor-lighthouse.md:6-7</text><text x="504" y="342" fill="#a9b6cc" font-size="13">followed the git rename</text><text x="504" y="364" fill="#a9b6cc" font-size="13">found the shifted lines</text><text x="504" y="386" fill="#a9b6cc" font-size="13">similarity 0.98</text><path d="M854 310h52" stroke="#4b5d80" stroke-width="2"/><path d="M900 304l8 6-8 6" fill="none" stroke="#4b5d80" stroke-width="2"/><rect x="918" y="210" width="316" height="200" rx="14" fill="#182235" stroke="#2b3a55"/><text x="940" y="244" fill="#8494b0" font-size="12">AGENT ANSWER CHECK</text><text x="940" y="278" fill="#7ee0b0">verified</text><text x="1048" y="278" fill="#a9b6cc" font-size="13">read in session</text><text x="940" y="308" fill="#f38b8b">unread_lines</text><text x="1072" y="308" fill="#a9b6cc" font-size="13">never saw it</text><text x="940" y="338" fill="#f38b8b">unresolved</text><text x="1056" y="338" fill="#a9b6cc" font-size="13">made-up file</text><text x="940" y="368" fill="#f38b8b">url_unsourced</text><text x="1080" y="368" fill="#a9b6cc" font-size="13">never fetched</text><text x="940" y="396" fill="#f5c26b">delegated</text><text x="1050" y="396" fill="#a9b6cc" font-size="13">subagent read it</text></g></svg>

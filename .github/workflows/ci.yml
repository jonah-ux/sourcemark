name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --exit-code 1 .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build --sdist --wheel
      - name: Verify source-distribution walkthrough resources
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile
          required = {"docs/walkthrough.html", "docs/releasing.md", "demos/demo.py", "tests/test_check_export.py"}
          with tarfile.open(next(Path("dist").glob("*.tar.gz"))) as archive:
              names = {"/".join(PurePosixPath(member.name).parts[1:]) for member in archive if member.isfile()}
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Source distribution missing resources: {missing}")
          print("Source distribution contains walkthrough, release guide, demo, and export tests")
          PY
      - name: Install wheel and verify CLI
        run: |
          python -m pip install --no-deps dist/*.whl
          sourcemark --version
          sourcemark --help
          env -u PYTHONPATH python demos/demo.py --installed
      - name: Verify fresh installed export consumers
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/sourcemark-wheel"
          python -m venv "$RUNNER_TEMP/sourcemark-sdist"
          "$RUNNER_TEMP/sourcemark-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/sourcemark-sdist/bin/python" -m pip install --no-deps dist/*.tar.gz
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          "$RUNNER_TEMP/sourcemark-wheel/bin/python" -c 'from pathlib import Path; import sys, sourcemark; source = Path(sourcemark.__file__).resolve(); assert source.is_relative_to(Path(sys.prefix).resolve()), source; print(source)'
          "$RUNNER_TEMP/sourcemark-wheel/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_check_export.py -v
          "$RUNNER_TEMP/sourcemark-sdist/bin/python" -c 'from pathlib import Path; import sys, sourcemark; source = Path(sourcemark.__file__).resolve(); assert source.is_relative_to(Path(sys.prefix).resolve()), source; print(source)'
          "$RUNNER_TEMP/sourcemark-sdist/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_check_export.py -v

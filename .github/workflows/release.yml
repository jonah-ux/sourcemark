name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Annotated tag to publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tag and package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, subprocess, tomllib
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", tag):
              raise SystemExit("release tag must be vMAJOR.MINOR.PATCH")
          subprocess.run(["git", "fetch", "--force", "origin", f"refs/tags/{tag}:refs/tags/{tag}"], check=True)
          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match project version {version}")
          tag_type = subprocess.check_output(["git", "cat-file", "-t", f"refs/tags/{tag}"], text=True).strip()
          if tag_type != "tag":
              raise SystemExit("release tag must be annotated")
          tagged = subprocess.check_output(["git", "rev-parse", f"refs/tags/{tag}^{{}}"], text=True).strip()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if tagged != head:
              raise SystemExit("release tag does not identify the checked-out HEAD")
          print(f"Release identity verified: {tag} -> {head}")
          PY
      - name: Verify source suite
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v
      - name: Build distributions and checksums
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - name: Verify wheel consumer
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/sourcemark-release-wheel"
          "$RUNNER_TEMP/sourcemark-release-wheel/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          "$RUNNER_TEMP/sourcemark-release-wheel/bin/python" -c 'from pathlib import Path; from importlib.metadata import version; import os, sys, sourcemark; source = Path(sourcemark.__file__).resolve(); assert source.is_relative_to(Path(sys.prefix).resolve()), source; assert sourcemark.__version__ == version("sourcemark") == os.environ["RELEASE_TAG"][1:]; print(source, sourcemark.__version__)'
          "$RUNNER_TEMP/sourcemark-release-wheel/bin/sourcemark" --version
          "$RUNNER_TEMP/sourcemark-release-wheel/bin/sourcemark" --help
          "$RUNNER_TEMP/sourcemark-release-wheel/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_check_export.py -v
          "$RUNNER_TEMP/sourcemark-release-wheel/bin/python" "$GITHUB_WORKSPACE/demos/demo.py" --installed > sourcemark-wheel-demo.txt
          "$RUNNER_TEMP/sourcemark-release-wheel/bin/python" -c 'from pathlib import Path; import json; result = json.loads(Path("sourcemark-wheel-demo.txt").read_text().splitlines()[-1]); assert result["ok"] is True and result["moved"] is True and result["resolve"] == "edited", result; assert result["citations"] == {"unread_lines": 1, "unresolved": 1, "url_unsourced": 1, "url_verified": 1, "verified": 1}, result; assert result["check_export"]["schema"] == "sourcemark/check/v1" and result["check_export"]["state"] == "partial", result; assert result["check_export"]["counts"] == {"failing": 3, "observations": 1, "passing": 2, "timed_out": 0, "total": 5, "unknown": 0}, result; print(json.dumps(result, sort_keys=True))'
      - name: Verify source consumer
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/sourcemark-release-sdist"
          "$RUNNER_TEMP/sourcemark-release-sdist/bin/python" -m pip install --no-deps dist/*.tar.gz
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          "$RUNNER_TEMP/sourcemark-release-sdist/bin/python" -c 'from pathlib import Path; from importlib.metadata import version; import os, sys, sourcemark; source = Path(sourcemark.__file__).resolve(); assert source.is_relative_to(Path(sys.prefix).resolve()), source; assert sourcemark.__version__ == version("sourcemark") == os.environ["RELEASE_TAG"][1:]; print(source, sourcemark.__version__)'
          "$RUNNER_TEMP/sourcemark-release-sdist/bin/sourcemark" --version
          "$RUNNER_TEMP/sourcemark-release-sdist/bin/sourcemark" --help
          "$RUNNER_TEMP/sourcemark-release-sdist/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_check_export.py -v
          "$RUNNER_TEMP/sourcemark-release-sdist/bin/python" "$GITHUB_WORKSPACE/demos/demo.py" --installed > sourcemark-sdist-demo.txt
          "$RUNNER_TEMP/sourcemark-release-sdist/bin/python" -c 'from pathlib import Path; import json; result = json.loads(Path("sourcemark-sdist-demo.txt").read_text().splitlines()[-1]); assert result["ok"] is True and result["moved"] is True and result["resolve"] == "edited", result; assert result["citations"] == {"unread_lines": 1, "unresolved": 1, "url_unsourced": 1, "url_verified": 1, "verified": 1}, result; assert result["check_export"]["schema"] == "sourcemark/check/v1" and result["check_export"]["state"] == "partial", result; assert result["check_export"]["counts"] == {"failing": 3, "observations": 1, "passing": 2, "timed_out": 0, "total": 5, "unknown": 0}, result; print(json.dumps(result, sort_keys=True))'
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.release_tag || github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "${{ github.repository }} ${{ inputs.release_tag || github.ref_name }}" \
            --generate-notes
